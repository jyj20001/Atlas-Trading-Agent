<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shield/base -->
  <rect x="8" y="4" width="32" height="36" rx="6" fill="#1a1a2e" stroke="#00d4aa" stroke-width="2"/>
  <!-- Chart line (upward trend) -->
  <polyline points="14,32 20,24 26,26 34,14" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Candle 1 -->
  <line x1="20" y1="20" x2="20" y2="28" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="18.5" y="22" width="3" height="6" rx="0.5" fill="#ff4757"/>
  <!-- Candle 2 -->
  <line x1="27" y1="19" x2="27" y2="30" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="25.5" y="20" width="3" height="8" rx="0.5" fill="#00d4aa"/>
  <!-- Buy Stop dot -->
  <circle cx="34" cy="14" r="3" fill="#00d4aa" opacity="0.8"/>
  <circle cx="34" cy="14" r="1.5" fill="#fff"/>
</svg>
